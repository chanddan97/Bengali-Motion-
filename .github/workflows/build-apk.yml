name: Build BanglaMotion Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK and AAB
        run: gradle assembleDebug bundleDebug --no-daemon

      - name: Upload BanglaMotion Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BanglaMotion-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload BanglaMotion Debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: BanglaMotion-debug-aab
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 30
